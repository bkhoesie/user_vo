name: Live VO API contract tests

# These tests hit the real VereinOnline API (a dedicated test account, but
# real production infrastructure - no VO sandbox org exists) rather than a
# mock. Now that feature work goes through PRs rather than direct pushes,
# development is infrequent enough (and a single contract-test run light
# enough on the API) that running on every PR and on push to main is fine -
# push is deliberately main-only, not feature/**, so it only fires once per
# PR-merge rather than on every intermediate push. workflow_dispatch covers
# "check this now"; nightly catches drift with no code change at all (VO's
# API behavior shifting server-side).
#
# Note: pull_request (not pull_request_target) means a fork-originated PR
# won't have access to the VO_TEST_* secrets and this job will fail for it -
# acceptable for a single-maintainer repo, revisit if that ever changes.
#
# (Briefly ran with a push trigger too, commit 4fd5fab, to get one real
# CI-runner verification in - workflow_dispatch can't be invoked via API/CLI
# for a workflow that only exists on a non-default branch. Confirmed passing
# there - 4 tests, 19 assertions, run 30747729688 - then reverted here.)
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch: {}
  schedule:
    - cron: '17 3 * * *' # nightly, off-peak, arbitrary minute to avoid the exact-hour stampede

permissions:
  contents: read

concurrency:
  group: live-api-tests
  cancel-in-progress: false

env:
  APP_NAME: user_vo

jobs:
  live-api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout server
        uses: actions/checkout@v5
        with:
          submodules: true
          repository: nextcloud/server
          ref: stable34

      - name: Checkout app
        uses: actions/checkout@v5
        with:
          path: apps/${{ env.APP_NAME }}

      - name: Set up php
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bz2, ctype, curl, dom, fileinfo, gd, iconv, intl, json, libxml, mbstring, openssl, pcntl, posix, session, simplexml, xmlreader, xmlwriter, zip, zlib, sqlite, pdo_sqlite
          tools: phpunit
          coverage: none
          ini-values: disable_functions=

      - name: Set up Nextcloud
        run: |
          mkdir data
          php occ maintenance:install --verbose --database=sqlite --admin-user admin --admin-pass admin
          php occ app:enable --force ${{ env.APP_NAME }}

      - name: Live VO API contract tests
        working-directory: apps/${{ env.APP_NAME }}
        env:
          VO_TEST_API_URL: ${{ secrets.VO_TEST_API_URL }}
          VO_TEST_API_USERNAME: ${{ secrets.VO_TEST_API_USERNAME }}
          VO_TEST_API_PASSWORD: ${{ secrets.VO_TEST_API_PASSWORD }}
          VO_TEST_MEMBER_USERNAME: ${{ secrets.VO_TEST_MEMBER_USERNAME }}
          VO_TEST_MEMBER_PASSWORD: ${{ secrets.VO_TEST_MEMBER_PASSWORD }}
        run: phpunit -c tests/LiveApi/phpunit.xml

      - name: Print Nextcloud log
        if: failure()
        run: cat data/nextcloud.log
