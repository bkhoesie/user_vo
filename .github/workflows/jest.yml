name: JS tests

# push is main-only: feature work goes through PRs now, and pull_request
# already covers CI for every push to an open PR's branch - a push trigger
# on feature/** as well would just double-run CI for the same commit once a
# PR exists. Nightly against main catches drift with no code push at all
# (e.g. a Jest/jsdom dependency update).
on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '15 3 * * *' # nightly, off-peak, arbitrary minute to avoid the exact-hour stampede

permissions:
  contents: read

concurrency:
  group: jest-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  jest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout app
        uses: actions/checkout@v5

      - name: Set up node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: js
        run: npm ci

      - name: Run Jest
        working-directory: js
        run: npm test
