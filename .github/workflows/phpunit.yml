name: PHPUnit

on:
  pull_request:
  push:
    branches:
      - main
      - 'feature/**'

permissions:
  contents: read

concurrency:
  group: phpunit-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  APP_NAME: user_vo

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      php-version: ${{ steps.versions.outputs.php-available-list }}
      # Test both the min and max Nextcloud version declared in appinfo/info.xml, not just the
      # max - catches both "upstream removed something we use" (max end) and "we accidentally
      # require something too new" (min end) regressions.
      server-versions: ${{ steps.combine.outputs.list }}
    steps:
      - name: Checkout app
        uses: actions/checkout@v5

      - name: Get version matrix
        id: versions
        uses: icewind1991/nextcloud-version-matrix@v1

      - name: Combine min+max server versions
        id: combine
        run: |
          echo -n "list=" >> "$GITHUB_OUTPUT"
          jq -c -n --argjson a '${{ steps.versions.outputs.branches-min-list }}' --argjson b '${{ steps.versions.outputs.branches-max-list }}' '($a + $b) | unique' >> "$GITHUB_OUTPUT"

  phpunit:
    runs-on: ubuntu-latest
    needs: matrix

    strategy:
      fail-fast: false
      matrix:
        php-versions: ${{ fromJson(needs.matrix.outputs.php-version) }}
        server-versions: ${{ fromJson(needs.matrix.outputs.server-versions) }}

    name: PHP ${{ matrix.php-versions }} / Nextcloud ${{ matrix.server-versions }}

    steps:
      - name: Checkout server
        uses: actions/checkout@v5
        with:
          submodules: true
          repository: nextcloud/server
          ref: ${{ matrix.server-versions }}

      - name: Checkout app
        uses: actions/checkout@v5
        with:
          path: apps/${{ env.APP_NAME }}

      - name: Set up php ${{ matrix.php-versions }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}
          # https://docs.nextcloud.com/server/stable/admin_manual/installation/source_installation.html#prerequisites-for-manual-installation
          extensions: bz2, ctype, curl, dom, fileinfo, gd, iconv, intl, json, libxml, mbstring, openssl, pcntl, posix, session, simplexml, xmlreader, xmlwriter, zip, zlib, sqlite, pdo_sqlite
          tools: phpunit:11
          coverage: none
          ini-values: disable_functions=

      - name: Set up Nextcloud
        run: |
          mkdir data
          php occ maintenance:install --verbose --database=sqlite --admin-user admin --admin-pass admin
          php occ app:enable --force ${{ env.APP_NAME }}

      - name: PHPUnit (unit)
        working-directory: apps/${{ env.APP_NAME }}
        run: phpunit -c tests/Unit/phpunit.xml

      - name: PHPUnit (integration)
        working-directory: apps/${{ env.APP_NAME }}
        run: phpunit -c tests/Integration/phpunit.xml

      - name: Print Nextcloud log
        if: failure()
        run: cat data/nextcloud.log
