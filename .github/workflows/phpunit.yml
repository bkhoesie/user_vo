name: PHPUnit

on:
  pull_request:
  push:
    branches:
      - main
      - 'feature/**'

permissions:
  contents: read

concurrency:
  group: phpunit-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  APP_NAME: user_vo

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      # sparse-matrix pairs every supported server version (both min and max from
      # appinfo/info.xml, not just max) with its OWN compatible PHP version - not just
      # whatever PHP happens to be available on the runner. This matters: e.g. Nextcloud 24
      # doesn't support PHP 8.3+ at all, so pairing every server version with the same
      # "latest available" PHP (an earlier, simpler version of this workflow did that) breaks
      # immediately on old versions for reasons that have nothing to do with our own code.
      sparse-matrix: ${{ steps.versions.outputs.sparse-matrix }}
    steps:
      - name: Checkout app
        uses: actions/checkout@v5

      - name: Get version matrix
        id: versions
        uses: icewind1991/nextcloud-version-matrix@v1

  phpunit:
    runs-on: ubuntu-latest
    needs: matrix

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.sparse-matrix) }}

    name: PHP ${{ matrix.php-versions }} / Nextcloud ${{ matrix.server-versions }}

    steps:
      - name: Checkout server
        uses: actions/checkout@v5
        with:
          submodules: true
          repository: nextcloud/server
          ref: ${{ matrix.server-versions }}

      - name: Checkout app
        uses: actions/checkout@v5
        with:
          path: apps/${{ env.APP_NAME }}

      - name: Set up php ${{ matrix.php-versions }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}
          # https://docs.nextcloud.com/server/stable/admin_manual/installation/source_installation.html#prerequisites-for-manual-installation
          extensions: bz2, ctype, curl, dom, fileinfo, gd, iconv, intl, json, libxml, mbstring, openssl, pcntl, posix, session, simplexml, xmlreader, xmlwriter, zip, zlib, sqlite, pdo_sqlite
          # No pinned version: PHPUnit 11 (what we use locally) requires PHP >= 8.2, which
          # older matrix legs (e.g. Nextcloud 24 on PHP 8.1) don't have. Let setup-php pick a
          # PHPUnit version compatible with whichever PHP this leg is running.
          tools: phpunit
          coverage: none
          ini-values: disable_functions=

      - name: Set up Nextcloud
        run: |
          mkdir data
          php occ maintenance:install --verbose --database=sqlite --admin-user admin --admin-pass admin
          php occ app:enable --force ${{ env.APP_NAME }}

      - name: PHPUnit (unit)
        working-directory: apps/${{ env.APP_NAME }}
        run: phpunit -c tests/Unit/phpunit.xml

      - name: PHPUnit (integration)
        working-directory: apps/${{ env.APP_NAME }}
        run: phpunit -c tests/Integration/phpunit.xml

      - name: Print Nextcloud log
        if: failure()
        run: cat data/nextcloud.log
