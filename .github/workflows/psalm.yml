name: Static analysis

# push is main-only: feature work goes through PRs now, and pull_request
# already covers CI for every push to an open PR's branch - a push trigger
# on feature/** as well would just double-run CI for the same commit once a
# PR exists. Nightly against main catches drift with no code push at all
# (e.g. a new nextcloud/ocp stub release).
on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '5 3 * * *' # nightly, off-peak, arbitrary minute to avoid the exact-hour stampede

permissions:
  contents: read

concurrency:
  group: psalm-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  psalm:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout app
        uses: actions/checkout@v5

      - name: Set up php
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      # psalm.xml's phpVersion="8.0" targets the plugin's actual min supported PHP
      # (appinfo/info.xml min-version=28) regardless of the PHP running psalm itself.
      # Single run against one nextcloud/ocp stub version (not a full NC-version matrix
      # like phpunit.yml) - OCP interfaces are stable enough across supported versions
      # that this catches real issues without the added CI complexity/cost.
      - name: Run Psalm
        run: vendor/bin/psalm --threads=1 --no-cache --monochrome --no-progress --output-format=github
